<!DOCTYPE html>
<html lang="es" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Oryon — Software para talleres de reparación</title>
    <meta
      name="description"
      content="Controla órdenes de trabajo, inventario y sucursales de tu taller técnico desde un solo lugar. Cero caos, cero reclamos, más ventas."
    />

    <!-- Grafito: el mismo color base del sistema de diseño, para que la barra del
         navegador y el fondo de la app sean la misma superficie. -->
    <meta name="theme-color" content="#0B0D0E" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oryon" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Oryon — Software para talleres de reparación" />
    <meta
      property="og:description"
      content="Órdenes en segundos con foto y patrón, seguimiento por QR para el cliente, inventario y sucursales bajo control."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Archivo (display) · IBM Plex Sans (texto) · JetBrains Mono (datos) ·
         Martian Mono (voz de marca: eyebrows y etiquetas). -->
    <!-- El reto de Turnstile tarda ~2 s desde que carga la pantalla de acceso y el
         formulario ya es usable a los 350 ms. Abrir la conexión aquí recorta parte
         de esa espera, que ahora el botón hace esperar antes de enviar. -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Martian+Mono:wght@400;500;700&display=swap"
    />

    <!-- Anti-FOUC: pinta el tema antes del primer frame. Debe quedar idéntico a
         applyTheme() en src/utils/ThemeContext.tsx. Dark-first: sin nada guardado,
         grafito. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('oryon-theme') || 'dark';
          var effective =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored;
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(effective);
          root.setAttribute('data-theme', effective);
        } catch (e) {
          /* localStorage bloqueado: se queda con el dark del atributo estático */
        }
      })();
    </script>

    <!-- =======================================================================
         Sting de apertura. Va inline y antes del bundle: se pinta en el primer
         frame, sin esperar a React ni a las webfonts (el wordmark es trazado, no
         texto). Los colores se declaran aquí porque los tokens del sistema aún no
         han cargado a estas alturas; el script anti-FOUC de arriba ya dejó puesto
         data-theme, así que claro y oscuro se resuelven solos.

         Termina exactamente donde arranca el loader de la app —mismo lockup, mismo
         tamaño, misma posición—, así que el relevo no se nota: el anillo se dibuja
         aquí y allí empieza a barrer.
         ======================================================================= -->
    <style>
      #oryon-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #0b0d0e;
        opacity: 1;
        transition: opacity 320ms ease-out;
      }
      :root[data-theme='light'] #oryon-splash { background: #f2f5f6; }

      #oryon-splash .oryon-ring {
        fill: none;
        stroke: #f2f5f6;
        stroke-width: 26;
        stroke-dasharray: 456;
        stroke-dashoffset: 456;
        transform: rotate(-90deg);
        transform-origin: 100px 100px;
        animation: oryon-draw-ring 900ms cubic-bezier(.16, 1, .3, 1) forwards;
      }
      #oryon-splash .oryon-bar,
      #oryon-splash .oryon-bloom {
        fill: none;
        stroke: #35e0ff;
        stroke-width: 26;
        stroke-linecap: butt;
      }
      #oryon-splash .oryon-bar {
        stroke-dasharray: 210;
        stroke-dashoffset: 210;
        animation: oryon-draw-bar 550ms cubic-bezier(.22, 1, .36, 1) 700ms forwards;
      }
      #oryon-splash .oryon-bloom {
        filter: url(#oryon-splash-bloom);
        opacity: 0;
        animation: oryon-bloom-pulse 900ms ease-out 1150ms forwards;
      }
      #oryon-splash .oryon-word { fill: #f2f5f6; }
      #oryon-splash .oryon-wipe-rect {
        transform: scaleX(0);
        transform-origin: 0 0;
        animation: oryon-wipe 600ms cubic-bezier(.22, 1, .36, 1) 1100ms forwards;
      }

      :root[data-theme='light'] #oryon-splash .oryon-ring,
      :root[data-theme='light'] #oryon-splash .oryon-word { stroke: #0b0e10; fill: #0b0e10; }
      :root[data-theme='light'] #oryon-splash .oryon-ring { fill: none; }
      :root[data-theme='light'] #oryon-splash .oryon-bar,
      :root[data-theme='light'] #oryon-splash .oryon-bloom { stroke: #0e6f82; }

      @keyframes oryon-draw-ring { to { stroke-dashoffset: 0; } }
      @keyframes oryon-draw-bar  { to { stroke-dashoffset: 0; } }
      @keyframes oryon-wipe      { to { transform: scaleX(1); } }
      @keyframes oryon-bloom-pulse {
        0%   { opacity: 0; }
        35%  { opacity: .55; }
        100% { opacity: 0; }
      }

      /* Sin movimiento: la marca aparece ya terminada, sin trazo ni barrido. */
      @media (prefers-reduced-motion: reduce) {
        #oryon-splash .oryon-ring,
        #oryon-splash .oryon-bar { animation: none; stroke-dashoffset: 0; }
        #oryon-splash .oryon-bloom { animation: none; opacity: 0; }
        #oryon-splash .oryon-wipe-rect { animation: none; transform: scaleX(1); }
      }
    </style>

    <!-- Wompi Checkout Widget Oficial -->
    <script type="text/javascript" src="https://checkout.wompi.co/widget.js"></script>
  </head>

  <body>
    <div id="oryon-splash" role="status" aria-label="Oryon">

        <defs>

          <clipPath id="oryon-splash-wipe">
            <rect class="oryon-wipe-rect" x="0" y="205" width="200" height="50" />

        <circle class="oryon-ring" cx="100" cy="100" r="72" />

        <line class="oryon-bar" x1="25.75" y1="174.25" x2="174.25" y2="25.75" />
        <g clip-path="url(#oryon-splash-wipe)">
          <g class="oryon-word" transform="translate(7.84 243) scale(0.043732 -0.043732)">

          </g>
        </g>
      </svg>
    </div>
    <script>
      window.__oryonSplashStart = Date.now();
      /* Red de seguridad: si el bundle no llega a ejecutarse —red caída, error de
         carga—, nadie retiraría el sting y quedaría una pantalla congelada con el
         logo. A los 8 s se va solo y al menos se ve el error de la app debajo. */
      setTimeout(function () {
        var s = document.getElementById('oryon-splash');
        if (s) s.remove();
      }, 8000);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
