# pnpm 10+ exige declarar qué dependencias pueden ejecutar scripts de instalación.
# @swc/core y esbuild descargan su binario nativo en el postinstall: sin ellos no hay build.
# core-js solo imprime un banner de donaciones, así que no necesita ejecutarse.
allowBuilds:
  '@swc/core': true
  core-js: false
  esbuild: true
