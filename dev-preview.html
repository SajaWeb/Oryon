<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Oryon · preview del shell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Martian+Mono:wght@400;500;700&display=swap"
    />
    <script>
      (function () {
        var stored = localStorage.getItem('oryon-theme') || 'dark';
        var applied = stored === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : stored;
        document.documentElement.classList.add(applied);
        document.documentElement.dataset.theme = applied;
        document.documentElement.style.colorScheme = applied;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/preview.tsx"></script>
  </body>
</html>
